name: exosites_mobile
description: Exo second brain — mobile capture + GO SYNC client
publish_to: none
version: 0.2.7+14

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  crypto: ^3.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  app_links: ^6.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../electron/assets/icon.png
  adaptive_icon_background: "#0F0B2E"
  adaptive_icon_foreground: ../electron/assets/icon.png
  remove_alpha_ios: true

flutter_native_splash:
  # Solid canvas only — cube draws itself in Flutter (ExoBootScreen).
  # Matches the light canvas so the handoff to Flutter has no flash.
  color: "#F0F2F8"
  android_12:
    color: "#F0F2F8"

flutter:
  # iOS 18 LLDB attach SIGKILLs debug launches on this device.
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    # Stroke geometry lives in exo_cube_draw.dart (from exo_cube.svg); PNG unused in UI.
    - assets/exo_cube.svg
    - assets/brands/google-sign-in.png
    - assets/brands/apple-sign-in.png
